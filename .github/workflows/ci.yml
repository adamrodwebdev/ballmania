name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  # Chromium only; Firefox and WebKit run in engines.yml.
  e2e:
    name: Playwright on Chromium (journeys and size matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # The ambience factory (spec § 3.18): a one-minute smoke render, checked again.
  ambiance:
    name: Ambience factory (smoke render and --check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: The game and the portal kits stay as they are (the factory's branches only)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/ambiance')
        run: |
          touched=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^(src/|marketing/(crazygames|playgama|yandex)/)' || true)
          if [ -n "$touched" ]; then echo "The factory must not change: $touched"; exit 1; fi
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run ambiance -- --mood abyss-sleep --minutes 1 --seed 1 --small
      - run: npm run ambiance -- --mood abyss-sleep --minutes 1 --seed 1 --small --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ambiance-smoke
          path: marketing/ambiance/out/
          retention-days: 7
