name: Firefox and WebKit

run-name: Firefox and WebKit on ${{ github.event_name == 'schedule' && 'dev' || github.ref_name }}

# The cross-browser rule (v1.9.0): pull requests and pushes play the journeys
# on Chromium (ci.yml); Firefox and WebKit play them every week and before
# every release, on dev, the code that ships next.
on:
  schedule:
    # Mondays at 05:00 UTC. GitHub starts a scheduled run from main, so the
    # job checks out dev.
    - cron: '0 5 * * 1'
  # By hand, before a release: gh workflow run engines.yml --ref dev
  workflow_dispatch:
  push:
    branches: [dev]
    # The version bump that comes before every release; Playwright or its
    # browsers updated; the projects or this workflow changed.
    paths:
      - package.json
      - package-lock.json
      - playwright.config.ts
      - .github/workflows/engines.yml

# A newer run on the same branch replaces the older one, scheduled runs included.
concurrency:
  group: engines-${{ github.event_name == 'schedule' && 'refs/heads/dev' || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright on ${{ matrix.project }} (${{ matrix.shard }}/${{ matrix.of }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # The runner draws without a GPU. Firefox keeps up with two workers (11 min).
      # WebKit draws in software on its main thread: with two pages at once, the
      # workshop stopped answering for tens of seconds and the run took 36 min to
      # an hour (03/11/2026). So each WebKit page gets the runner to itself, and
      # the tests are shared out over four runners.
      matrix:
        include:
          - { project: firefox-desktop, browser: firefox, workers: 2, shard: 1, of: 1 }
          - { project: webkit-desktop, browser: webkit, workers: 1, shard: 1, of: 4 }
          - { project: webkit-desktop, browser: webkit, workers: 1, shard: 2, of: 4 }
          - { project: webkit-desktop, browser: webkit, workers: 1, shard: 3, of: 4 }
          - { project: webkit-desktop, browser: webkit, workers: 1, shard: 4, of: 4 }
          - { project: webkit-mobile, browser: webkit, workers: 1, shard: 1, of: 4 }
          - { project: webkit-mobile, browser: webkit, workers: 1, shard: 2, of: 4 }
          - { project: webkit-mobile, browser: webkit, workers: 1, shard: 3, of: 4 }
          - { project: webkit-mobile, browser: webkit, workers: 1, shard: 4, of: 4 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # The line reporter prints each failure when it happens: a run stopped by
      # its time limit still says why its tests failed.
      - run: >-
          npx playwright test --project=${{ matrix.project }} --workers=${{ matrix.workers }}
          --shard=${{ matrix.shard }}/${{ matrix.of }} --reporter=line
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: playwright-traces-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
