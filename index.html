<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ballmania — le tir de billes réinventé</title>
    <meta
      name="description"
      content="Tir de billes en chaîne réinventé&nbsp;: campagne de six mondes, nouveaux modes, explosions spectaculaires. Gratuit, sans inscription, sur mobile et ordinateur."
    />
    <!-- The bar of the browser in the colour of the theme shown (theme-boot.js, then App.vue). -->
    <meta name="theme-color" content="#05030d" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Synchronous and tiny: applies the saved theme before the first paint. Our site's
         build puts it inline, allowed by its hash in the CSP (vite.config.ts, firstPaint). -->
    <script src="./theme-boot.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p>
        Ballmania est un jeu&nbsp;: activez JavaScript pour jouer. · Ballmania is a game: please
        enable JavaScript to play.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
